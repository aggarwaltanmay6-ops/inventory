services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: stride_migrator
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set a strong DATABASE_PASSWORD in .env}
      POSTGRES_DB: stride
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U stride_migrator -d stride']
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    image: stride-inventory:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the runtime PostgreSQL connection URL in .env}
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN to your hostname}
      TRUST_PROXY: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
